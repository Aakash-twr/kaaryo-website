<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A3C30" />

    <!-- Icons. favicon.svg is the same gradient mark as components/icons/Logo.jsx,
         so the tab and the nav never disagree. The PNGs are fallbacks: Safari
         still prefers a raster apple-touch-icon, and older Android reads the
         manifest sizes. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- The two faces the first screen is built from: the hero headline (which
         is the LCP element) and body copy. Fetched in parallel with the CSS
         instead of waiting for it to parse. JetBrains Mono is deliberately not
         preloaded — it only sets small supporting labels, and a third preload
         would compete with the headline for bandwidth. -->
    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- seo:start
         Everything between these markers is replaced per route at build time by
         scripts/build-static.mjs, which writes one real HTML file per page.
         That indirection exists because social scrapers (WhatsApp, LinkedIn,
         Slack, iMessage) never run JavaScript — tags added by React would be
         invisible to them.

         The defaults below are the home page's, and are what `npm run dev`
         serves. Edit copy in src/data/seo.js, not here. -->
    <title>Kaaryo — Get any home work done in 20 minutes</title>
    <meta
      name="description"
      content="Book verified electricians, cleaners, cooks and plumbers across Hyderabad, Delhi and Bangalore. Fixed prices, live tracking, someone at your door in 20 minutes."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kaaryo.vercel.app" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaaryo" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Kaaryo — Get any home work done in 20 minutes" />
    <meta
      property="og:description"
      content="Book verified electricians, cleaners, cooks and plumbers across Hyderabad, Delhi and Bangalore. Fixed prices, live tracking, someone at your door in 20 minutes."
    />
    <meta property="og:url" content="https://kaaryo.vercel.app" />
    <meta property="og:image" content="https://kaaryo.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kaaryo — verified home professionals at your door in 20 minutes."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaaryo — Get any home work done in 20 minutes" />
    <meta
      name="twitter:description"
      content="Book verified electricians, cleaners, cooks and plumbers across Hyderabad, Delhi and Bangalore. Fixed prices, live tracking, someone at your door in 20 minutes."
    />
    <meta name="twitter:image" content="https://kaaryo.vercel.app/og.png" />
    <meta
      name="twitter:image:alt"
      content="Kaaryo — verified home professionals at your door in 20 minutes."
    />
    <!-- seo:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
